# Phase 0 collector, on a schedule.
#
# BUILD_BRIEF.md section 3 asks for four to six weeks of forward collection, and
# section 1 explains why it cannot be shortcut: on-chain history is backfillable,
# per-token social history is not. A token that dies today is only in the dataset
# if something was watching today. This workflow is that something.
#
# State lives in Neon once the DATABASE_URL secret is set (collectors/neon.py):
# append-only journal_* tables the database itself refuses to change, with a local
# mirror cached between runs so each run downloads only what is new. Without the
# secret, it lives in state/ -- an append-only journal (collectors/journal.py)
# committed back to the repo after each run, one directory per table and one shard
# per UTC day. It is rebuilt into DuckDB at the start of a run and appended to at the end,
# so nothing is ever rewritten and the diff of each commit is exactly the rows that
# were added.
#
# The shards exist because GitHub refuses a push containing any file over 100 MiB.
# When state/scores.jsonl crossed it on 2026-09-20, this job kept running, kept
# collecting, and kept failing at the push below -- and every run's rows went with
# its runner. A red run here means data is being lost, not merely delayed.
#
# A note on cost, because it decides the interval you actually want:
#
#   * This workflow runs HOURLY, which at roughly two minutes a run is ~1,450
#     minutes a month -- inside a private repository's 2,000 free minutes.
#   * A public repository has unlimited Actions minutes, so there every 30 minutes
#     ("*/30 * * * *") is both affordable and better: see the note on the cron.
#   * GitHub throttles scheduled workflows under load and drops them entirely on
#     repositories with no activity for 60 days. For a collector whose whole value
#     is not missing hours, a small always-on host is the better home; this
#     workflow is the version that needs no infrastructure.
#
# IMPORTANT: GitHub runs `schedule` triggers only from the repository's DEFAULT
# branch. While this file lives on a feature branch it will never fire on its own,
# no matter what the cron says -- the collector simply does nothing and there is no
# error anywhere to notice. Merge to the default branch, or drive it by hand from
# the Actions tab (Run workflow), which works on any branch.
#
# It cannot trade. DexScreener, GoPlus and RugCheck are all keyless; the only
# secrets in use are the token GitHub provides for the commit and, when the X
# collector is switched on, X_BEARER_TOKEN -- a read-only search key, set under
# Settings -> Secrets and variables -> Actions, never in the repository.

name: collect

on:
  schedule:
    # Hourly, to fit a private repository's 2,000 free Actions minutes a month.
    #
    # This is a real trade-off, not a free saving. Tokens cross $250k and die
    # inside an hour, so an hourly poll misses some of them entirely -- and a
    # token that is never observed is not in the graveyard, which is the dataset.
    # The loss is invisible in the counts afterwards: the sample simply looks
    # smaller, not biased, when in fact it is slightly biased toward tokens that
    # lived long enough to be seen.
    #
    # Every 30 minutes ("*/30 * * * *") halves that and costs ~2,900 minutes a
    # month; on a public repository, where minutes are unlimited, prefer it.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated chains to poll (blank = the collector's own default set)"
        default: ""
        required: false
      regime:
        description: "Tape regime recorded on this batch (hot / neutral / cold)"
        default: "neutral"
        required: false
      safety:
        description: "Run the GoPlus/RugCheck lookups"
        type: boolean
        default: true
        required: false

# One run at a time. Two runs appending to the same journal would both be correct
# in isolation and would conflict on push, and cancel-in-progress would throw away
# a run that had already collected rows.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # "true" once the DATABASE_URL secret exists, which is what switches the
      # dataset from state/ to Neon (collectors/neon.py). A secret cannot appear in
      # a step's `if:` directly; this can.
      NEON_ON: ${{ secrets.DATABASE_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      # The run's working copy of the Neon dataset, kept between runs so each one
      # downloads only the rows added since, not the whole dataset. A cache and
      # never the record: a miss, an eviction or a mismatch just means the first
      # pull rebuilds it from Neon.
      - name: Restore the Neon mirror
        if: env.NEON_ON == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .neon-mirror
          key: neon-mirror-${{ github.run_id }}
          restore-keys: neon-mirror-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From pyproject's own dependency list, not a subset hand-copied here. The
      # hand-copied version was `pip install duckdb`, and it broke the moment
      # collect.py grew an import of a module that uses requests: the workflow
      # installed what someone remembered, and the code needed what it needed.
      # tests/test_chains_and_live.py asserts this stays true.
      - name: Install dependencies
        run: python -m pip install --quiet -e .

      - name: Collect
        id: collect
        env:
          # Blank by default, on purpose. `collect.py` derives its own chain list
          # from collectors/chains.py, which already includes anything bound below
          # -- so binding Robinhood Chain is the whole decision and there is no
          # second place here to forget to add the name. A value typed into the
          # workflow_dispatch box still wins.
          CHAINS: ${{ inputs.chains }}
          REGIME: ${{ inputs.regime || 'neutral' }}
          # Bind a chain whose DexScreener id this repo does not ship, e.g.
          # "robinhood=<id>". Two commands find and check one:
          #   python -m collectors.dexscreener --discover-chains
          #   python -m collectors.dexscreener --verify-chain-id <candidate>
          SCREENER_CHAIN_IDS: ${{ vars.SCREENER_CHAIN_IDS }}
          # Token addresses to poll regardless of whether anyone boosted them.
          # Discovery is boosted and profiled tokens -- a paid-for sample -- so a
          # chain can be live and produce an empty poll forever. A seed says "this
          # token exists, look at it"; it does not bypass the trigger.
          SCREENER_SEED_TOKENS: ${{ vars.SCREENER_SEED_TOKENS }}
          # The one metered source here. Absent, the X collector stays off and the
          # run summary says so -- see docs/x-investigation.md. The budget caps
          # what a single cycle may spend; every other source is keyless.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # 5 searches a cycle unless the variable says otherwise, because the
          # first cycle after the secret is added is the expensive one: a missed
          # offset stays due, so the newest 200 snapshots bring up to 800 overdue
          # searches, enough to spend a month's read quota in one hour. 5 an hour
          # is ~120 a day, about what ~30 new tokens at four offsets need, and
          # newest-first ordering spends it on fresh tokens before the backlog.
          # Set the variable to raise it, or to 0 to stop searching; an unset
          # variable is "", which is falsy here, so it falls through to 5.
          X_MAX_SEARCHES_PER_CYCLE: ${{ vars.X_MAX_SEARCHES_PER_CYCLE || '5' }}
          # Neon's connection string, as the Vercel integration names it. Blank --
          # no secret -- keeps the dataset in state/ exactly as before.
          SCREENER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          SAFETY=""
          if [ "${{ inputs.safety }}" = "false" ]; then SAFETY="--no-safety"; fi
          # An array, so a typed "solana, bnb" stays one argument, as it was when
          # this line read --chains "$CHAINS"; unquoted, it split at the space.
          CHAIN_ARG=()
          if [ -n "$CHAINS" ]; then CHAIN_ARG=(--chains "$CHAINS"); fi
          python -m collect \
            "${CHAIN_ARG[@]}" \
            --regime "$REGIME" \
            --state state \
            --mirror .neon-mirror \
            --export web/screener-data.json \
            $SAFETY | tee summary.json
          {
            echo 'summary<<EOF'
            python -c "
          import json
          s = json.load(open('summary.json'))
          t = s.get('totals', {})
          print(
              f\"observed={s.get('poll', {}).get('observed', 0)} \"
              f\"fired={s.get('poll', {}).get('fired', 0)} \"
              f\"snapshots={t.get('snapshots', 0)} \"
              f\"labelled={t.get('labelled_snapshots', 0)} \"
              f\"safety={t.get('safety_observations', 0)}\"
          )
          "
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Saved only after a successful collect: a mirror from a run that failed
      # half-way could hold rows past its recorded watermark, and the next run would
      # have to rebuild it. A run that fails leaves the previous good one in place.
      - name: Save the Neon mirror
        if: success() && env.NEON_ON == 'true'
        uses: actions/cache/save@v4
        with:
          path: .neon-mirror
          key: neon-mirror-${{ github.run_id }}

      # With Neon on, state/ only changes in manifest.json -- the heartbeat
      # health.yml reads -- so this commits the heartbeat and the web export.
      - name: Commit the journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state web/screener-data.json
          if git diff --cached --quiet; then
            echo "nothing new this cycle"
            exit 0
          fi
          git commit -m "collect: ${{ steps.collect.outputs.summary }}"
          # Another run may have landed while this one was collecting. Rebase
          # rather than force: the journal is append-only, so both sets of rows
          # are wanted and neither may overwrite the other.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep $((attempt * 5))
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-summary-${{ github.run_id }}
          path: summary.json
          if-no-files-found: ignore
          retention-days: 14
